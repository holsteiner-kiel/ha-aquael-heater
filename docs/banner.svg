<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Aquael Heater Home Assistant integration banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2338"/>
      <stop offset="1" stop-color="#06111d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42e7ff"/>
      <stop offset="1" stop-color="#0b82d8"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#ff6b1a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#0d3852" opacity="0.35"/>
  <circle cx="90" cy="360" r="220" fill="#0a526d" opacity="0.22"/>

  <!-- title icon -->
  <g transform="translate(60 58)" filter="url(#glow)">
    <path d="M0 40 L42 8 L84 40" fill="none" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 42 V86 H72 V42" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 94 C34 86 48 102 62 94 C72 89 78 91 86 96" fill="none" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 28 V68" fill="none" stroke="url(#orange)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="75" r="10" fill="none" stroke="url(#orange)" stroke-width="7"/>
  </g>

  <text x="175" y="115" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#f4fbff">Aquael <tspan fill="#21c7ff">Heater</tspan></text>
  <text x="178" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#cfe7f2">Home Assistant custom integration for Aquael Flow Heater BT</text>

  <!-- feature row -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#eaf8ff" font-size="17">
    <g transform="translate(70 208)">
      <path d="M12 0 v30" stroke="#22d3ff" stroke-width="4" stroke-linecap="round"/><circle cx="12" cy="36" r="8" fill="none" stroke="#22d3ff" stroke-width="4"/>
      <text x="38" y="14">Monitor</text><text x="38" y="37">temperature</text>
    </g>
    <g transform="translate(285 208)">
      <circle cx="16" cy="18" r="13" fill="none" stroke="#22d3ff" stroke-width="4"/><path d="M16 0 v8 M16 28 v8 M0 18 h8 M24 18 h8" stroke="#22d3ff" stroke-width="4" stroke-linecap="round"/>
      <text x="46" y="14">Control</text><text x="46" y="37">heater settings</text>
    </g>
    <g transform="translate(515 208)">
      <path d="M0 38 H42 M4 32 L16 20 L28 26 L40 8" fill="none" stroke="#22d3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="14">Automate</text><text x="58" y="37">with Home Assistant</text>
    </g>
    <g transform="translate(805 208)">
      <path d="M16 4 C7 8 5 16 5 26 v8 h22 v-8 C27 16 25 8 16 4 Z" fill="none" stroke="#22d3ff" stroke-width="4"/><path d="M11 40 h10" stroke="#22d3ff" stroke-width="4" stroke-linecap="round"/>
      <text x="48" y="14">Get</text><text x="48" y="37">notifications</text>
    </g>
  </g>

  <!-- aquarium -->
  <g transform="translate(65 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="470" height="110" rx="10" fill="#082138" stroke="#36dfff" stroke-width="3" opacity="0.95"/>
    <path d="M0 28 C70 15 105 44 175 30 C250 14 320 48 470 24 V110 H0 Z" fill="#0ba8d7" opacity="0.35"/>
    <path d="M20 92 C50 48 72 42 94 92 M92 92 C118 44 145 32 170 92 M390 92 C415 48 440 38 456 92" fill="none" stroke="#66e38e" stroke-width="8" stroke-linecap="round"/>
    <g fill="#f5a12a"><ellipse cx="245" cy="57" rx="16" ry="8"/><path d="M228 57 l-16 -10 v20 z"/></g>
    <g fill="#70dfff" opacity="0.95"><circle cx="290" cy="45" r="4"/><circle cx="312" cy="35" r="5"/><circle cx="330" cy="55" r="4"/></g>
  </g>

  <!-- dashboard -->
  <g transform="translate(585 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="140" rx="14" fill="#0b1d2f" stroke="#245678"/>
    <text x="22" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#d8edf8">Aquarium Temperature</text>
    <text x="22" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#f7fbff">24.8 °C</text>
    <text x="22" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#c7dce7">Target: <tspan fill="#ff9b28">25.0 °C</tspan></text>
    <rect x="190" y="30" width="110" height="44" rx="10" fill="#102b43" stroke="#245678"/>
    <text x="210" y="57" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#f7fbff">Heater <tspan fill="#ff9b28">On</tspan></text>
    <rect x="190" y="90" width="110" height="12" rx="6" fill="#173c5c"/>
    <rect x="190" y="90" width="76" height="12" rx="6" fill="#21c7ff"/>
  </g>

  <!-- external inline flow heater -->
  <g transform="translate(945 90)" filter="url(#shadow)">
    <path d="M95 0 C40 5 38 44 78 70 C126 101 118 139 66 156" fill="none" stroke="#67eaff" stroke-width="24" stroke-linecap="round" opacity="0.58"/>
    <path d="M95 0 C40 5 38 44 78 70 C126 101 118 139 66 156" fill="none" stroke="#0b6fc5" stroke-width="10" stroke-linecap="round"/>
    <path d="M75 38 l22 4 l-16 16" fill="none" stroke="#5df9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 138 l-22 5 l13 -18" fill="none" stroke="#5df9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="72" width="70" height="132" rx="20" fill="#0a111c" stroke="#ff9b28" stroke-width="3"/>
    <rect x="76" y="108" width="10" height="58" rx="5" fill="#ff7a1a" filter="url(#glow)"/>
    <circle cx="81" cy="173" r="12" fill="none" stroke="#ff9b28" stroke-width="7"/>
    <text x="91" y="148" transform="rotate(-90 91 148)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#70899a">FLOW HEATER</text>
  </g>
</svg>
